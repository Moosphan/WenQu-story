[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wenqu-story-agent"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}
description = "A persistent Chinese fiction writing engine for skills, MCP and GUI"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.12,<2", "jsonschema>=4.20,<5", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.24,<2", "pyyaml>=6,<7", "tokenizers>=0.20,<1"]
tokenizers = ["tokenizers>=0.20,<1"]
semantic = ["sentence-transformers>=3.4,<6", "hnswlib>=0.8,<0.9", "numpy>=1.26,<3"]
tts = ["edge-tts>=7.2,<8"]

[project.scripts]
wenqu = "story_core.cli:main"
hulk-story = "story_core.cli:main"

[tool.setuptools.packages.find]
include = ["story_core*"]

[tool.setuptools.package-data]
story_core = ["web/*", "web/brand/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
